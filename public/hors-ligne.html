<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne · JuriQuizz</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ece9e2; color: #1f2430;
      }
      main {
        max-width: 480px; padding: 24px; border-radius: 14px; background: #fbfaf7;
        border: 1px solid rgba(31, 36, 48, 0.2); border-top: 3px solid #8f3d1c;
      }
      h1 { font-family: Palatino, "Palatino Linotype", Georgia, serif; margin: 0 0 8px; }
      button {
        font: inherit; font-weight: 600; margin-top: 12px; padding: 10px 16px; min-height: 44px;
        border-radius: 10px; border: 1px solid #8f3d1c; background: #8f3d1c; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12141b; color: #eceae4; }
        main { background: #181b24; border-color: rgba(236, 234, 228, 0.18); border-top-color: #f2a97c; }
        button { background: #f2a97c; border-color: #f2a97c; color: #14110f; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pas de connexion</h1>
      <p>JuriQuizz a besoin d&rsquo;internet pour charger les questions et enregistrer tes scores. Une partie terminée hors ligne est envoyée automatiquement au retour du réseau.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
